<!DOCTYPE html>
<html>
  <head>
    <title>Forms</title>
  </head>
  <body>
	  <form>
		  <fieldset>
			  <!-- The fieldset tag is used to group related elements in a form and draws a box around them-->
			  <legend>Personal Information:</legend>
			  <label>Full name:</label>
			  <!--placeholder attribute can be used to provide extra information about entry to be made-->
			  <input type="text" placeholder="Enter Name"><br><br>
			  <label>Email:</label>
			  <input type="text"><br><br>
			  <label>Contact Number (This will be hidden)</label><br>
		      <input type="password"><br><br>
			  <label>Gender:</label><br>
			  <input type="radio" name="gender" value="female">Female<br>
			  <input type="radio" name="gender" value="male">Male<br><br>
			  <label>Favourite City</label><br>
		      <input type="checkbox" id="city" value="New Delhi">New Delhi<br>
		      <input type="checkbox" id="city" value="Mumbai">Mumbai<br><br>
			 <lable>Favourite colour:</lable> <br>
			  <select name="colour" id="colour">
				<option value="Red">Red</option>
				<option value="Blue">Blue</option>
				<option value="Green">Green</option>
				<option value="Pink">Pink</option>
				<option value="Purple">Purple</option>
			</select><br><br>
			  <label>Birthday:</label>
			  <input type="date" id="birthday" name="birthday"><br><br>
			  <input type="submit">
		  </fieldset>
	  </form>
  </body>
</html>
