<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <h2>Adding images</h2>
    <img src="dogimage.jpg" style="height: 200px; width: 200px;">
    <h2>Adding Audio</h2>
    <audio controls>
        <source src="big-dog-barking-300504.mp3" type="audio/mpeg">
    </audio>
    <h2>Adding Video</h2>
    <video controls height="300" width="250">
        <source src="5496003-uhd_3840_2160_24fps.mp4" type="video/mp4">
    </video>
    <h2>Adding iframe</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/ryUxrFUk6MY?si=eyzA0W5eOP50SeFM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="200" height="200" src="https://www.youtube.com/embed/35i-3XIn4ls?si=zaCrNXKAvvqU4wtX" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
