<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bootstrap utilities</title>
	<link rel="stylesheet" href=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
	<script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
	</script>
</head>
<body>
	<h1 style="color:orange;text-align:center;">
        Codingal
    </h1>
	<div class="container">
    <div class="card" style="width: 18rem;">
        <img class="card-img-top" src=
"https://t3.ftcdn.net/jpg/03/46/83/96/360_F_346839683_6nAPzbhpSkIpb8pmAwufkC7c5eD7wYws.jpg"
                                alt="Card image cap">
        <div class="card-body">
            <h5 class="card-title">User Name</h5>
            <p class="card-text">Passionate about programming.</p>
 
            <a href="#" class="btn btn-primary">See Profile</a>
        </div>
    </div>
	</div>
    <hr>
    <div class="container">
        <h2>Spinners</h2>
        <p>To create a spinner/loader, use the <code>.spinner-border</code> class:</p>
                                              
        <div class="spinner-border"></div>
      </div>
      <hr>
      <div class="container">
        <h2>Pagination </h2>
        <p> Fall in love with coding</p>
        <!-- Declare the pagination class -->
              <ul class="pagination">
        
                  <!-- Declare the item in the group -->
                  <li class="page-item">
        
                      <!-- Declare the link of the item -->
                      <a class="page-link" href="#">Previous</a>
                  </li>
                    <!-- Rest of the pagination items -->
                  <li class="page-item">
                      <a class="page-link" href="#">1</a>
                  </li>
                  <li class="page-item">
                      <a class="page-link" href="#">2</a>
                  </li>
                  <li class="page-item">
                      <a class="page-link" href="#">3</a>
                  </li>
                  <li class="page-item">
                      <a class="page-link" href="#">Next</a>
                  </li>
              </ul>
      </div>
</body>

</html>
