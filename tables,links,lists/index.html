<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>This is an example of hyperlinks</h2>
    <a href="https://www.google.com" >Visit Google</a>
    <h2>Tables</h2>
    <table border="5">
        <tr>
            <th>Name</th>
            <th>Grade</th>
            <th>School</th>
        </tr>
        <tr>
            <td>Vihaan</td>
            <td>9</td>
            <td>Wockardt Global School</td>
        </tr>
        <tr>
            <td>Yatharth</td>
            <td>8</td>
            <td>Wockardt Global School</td>
        </tr>
    </table>
    <h2>Lists</h2>
    <h3>Ordered List</h3>
    <ol>
        <li>Yellow</li>
        <li>Blue</li>
        <li>Purple</li>
    </ol>
    <h3>Unordered List</h3>
    <ul>
        <li>Yellow</li>
        <li>Blue</li>
        <li>Purple</li>
    </ul>
    <h3>Description List</h3>
    <dt>Coffee</dt>
    <dd>Hot drink</dd>
    <dt>Sprite</dt>
    <dd>Cold drink</dd>
</body>
</html>
