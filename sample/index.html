<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML elements</title>
</head>
<body>
    <p>This is a paragraph</p>
    <p>THis is another paragraph</p>
