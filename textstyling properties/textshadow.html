<!DOCTYPE html>
<html>

<head>
  <style>
    *{
      text-align: center;
      font-family: monospace;
    }
    #text{
      text-shadow: -5px -5px 1px greenyellow;
      /* (right-offset)px (bottom-offset)px (fade)px color*/
    }
    #box{
      box-shadow: -9px -9px 10px #b609d5;
      /* (right-offset)px (left-offset)px (fade)px color*/
    }
	#indent{
            text-indent: 100%; 
        }
  </style>
</head>
<body>
    <h1 id="text">We can use text-shadow to give shadow to text itself</h1>
    <h1 id="box"> box-shadow </h1>
<div>
        <p>This is an example of text-indent.</p>
        <p  id="indent">This is an example of text-indent.</p>
    </div>
</body>

</html>
