<!DOCTYPE html>
<html>
<title>Typography</title>
<style>
.text1 {
  color:red;
  font-size:30px;
}
.p1 {
  color:blueviolet;
  font-family:'Courier New', 'Courier', 'monospace';
}
div {
  width: 300px;
  height: 100px;
  background-color: yellow;
  border: 1px solid black;
}
#myDiv {
  transform: rotateX(180deg);
}
h1 {
  text-decoration: overline;
  text-transform: capitalize;
}
h2 {
  text-decoration: line-through;
  text-transform: uppercase;
}
h3 {
  text-decoration: underline;
  text-transform: lowercase;
}
h4 {
  text-decoration: underline overline;
  text-transform: none;
}
*{
      text-align: center;
      font-family: monospace;
    }
#text{
text-shadow: -2px 2px 4px #CC5500;
      /* (right-offset)px (bottom-offset)px (fade)px color*/
}
#box{
      box-shadow: 9px 9px 10px #b609d5;
      /* (right-offset)px (bottom-offset)px (fade)px color*/
}
#indent{
            text-indent: 90%; 
        }

</style>
</head>

<body>
   <h1>Typography</h1>
 <p class="text1">Welcome to codingal</p>
<p class="p1">Welcome to codingal</p>

<hr>
<div>
Codingal
</div>
<div id="myDiv">
Codingal
</div>
<hr>
<h1>codingal</h1>
<h2>codingal</h2>
<h3>CODINGAL</h3>
<h4>CODINGAL</h4>
<hr>
<h1 id="text">We can use text-shadow to give shadow to text itself</h1>
    <h1 id="box">Or use box-shadow to give shadow to the element</h1>
    <hr>
<div>
        <p>This is an example of text-indent.</p>
        <p id="indent">This is an example of text-indent.</p>
    </div>

</body>
</html>
