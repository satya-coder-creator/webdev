<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <link rel="stylesheet" href="style2.css">
    <style>   /* internal css*/
        h2{
            color:yellow;
        }
        p{
            font-size: 30px;
            color:green;
        }
        #para1{
            color:pink;
            font-size:20px;
        }
        .mystyles
        {
            font-family:"Arial";
            background-color:purple;
            color:white;
        }
    </style>
</head>
<body>
    <h1 style="background-color: red;color:blue">Welcome to CSS</h1>
    <h2 class="mystyles">CSS - Cascading Style Sheets</h2>
    <p>CSS is used to add style to the webpages</p>
    <p id="para1">CSS makes webpages colorful</p>
    <p class="mystyles">There are 3 ways of adding styles</p>
    <h3>Inline, Internal, External</h3>
    <h4>Inline - along with the element</h4>
    <h5>Internal - in the head element</h5>
    <h6>External - seperate file</h6>
</body>
</html>
